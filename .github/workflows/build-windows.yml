name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  export-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false

      - name: Install export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $templateVersion = "4.4.1.stable"
          $templateDir = Join-Path $env:APPDATA "Godot\export_templates\$templateVersion"
          New-Item -ItemType Directory -Force -Path $templateDir | Out-Null
          $url = "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\templates.zip"
          Expand-Archive -LiteralPath "$env:TEMP\templates.zip" -DestinationPath "$env:TEMP\godot-templates" -Force
          Copy-Item "$env:TEMP\godot-templates\templates\*" $templateDir -Recurse -Force
          if (!(Test-Path (Join-Path $templateDir "windows_release_x86_64.exe"))) {
            Get-ChildItem $templateDir -Recurse | Select-Object FullName
            throw "Windows x86_64 release template was not installed."
          }

      - name: Validate project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $godotExe = Join-Path $env:USERPROFILE "godot\Godot_v4.4.1-stable_win64.exe"
          if (!(Test-Path $godotExe)) { throw "Godot executable not found: $godotExe" }
          & $godotExe --headless --editor --path . --quit *> godot-import.log
          $code = $LASTEXITCODE
          Get-Content godot-import.log
          if ($code -ne 0) { exit $code }

      - name: Export portable executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $godotExe = Join-Path $env:USERPROFILE "godot\Godot_v4.4.1-stable_win64.exe"
          if (!(Test-Path $godotExe)) { throw "Godot executable not found: $godotExe" }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          & $godotExe --headless --verbose --path . --export-release "Windows Desktop" "build/CidadeLivre3D.exe" *> export.log
          $code = $LASTEXITCODE
          Get-Content export.log
          if ($code -ne 0) { exit $code }
          if (!(Test-Path "build/CidadeLivre3D.exe")) { throw "Godot did not create build/CidadeLivre3D.exe. See export.log." }

      - name: Package portable game
        shell: pwsh
        run: |
          Compress-Archive -Path "build/CidadeLivre3D.exe" -DestinationPath "CidadeLivre3D-Windows-Portable.zip" -Force

      - name: Upload game package
        uses: actions/upload-artifact@v4
        with:
          name: CidadeLivre3D-Windows-Portable
          path: CidadeLivre3D-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30
